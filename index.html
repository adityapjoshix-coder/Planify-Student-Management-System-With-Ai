<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planify: Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="shell">
<header class="top">
 <div class="logo"><i></i>Planify</div>
 <nav id="nav"><button data-a="view" data-p="home">Home</button><button data-a="view" data-p="task">Task</button><button data-a="view" data-p="test">Test</button><button data-a="view" data-p="report">Report</button></nav>
 <button class="chip" data-a="mt">▶ Media</button><button class="chip" data-a="dr">⚙ Customize</button>
 <div class="user"><div id="av"></div><div><b id="un"></b><small id="ur"></small></div></div>
</header>
<div class="body"><main id="main"></main><aside id="side"></aside></div>
</div>

<aside id="dr" aria-label="Customize">
 <div class="ch"><b>Customize</b><button class="x" data-a="dr" aria-label="Close">×</button></div>
 <label>Your name</label><input data-s="name"><label>Role</label><input data-s="role">
 <label>Accent colour</label><input type="color" data-s="ac" style="height:36px;padding:2px">
 <div class="sw" id="sw"></div>
 <label>Theme</label><select data-s="theme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select>
 <label>Corner roundness</label><input type="range" min="4" max="28" data-s="r">
 <h4>Banner media</h4>
 <label>Show</label><select data-s="mm"><option value="text">Colour banner</option><option value="photos">Photos (1–5, sliding)</option><option value="video">Video (loops)</option></select>
 <label>Add photos (max 5)</label><input type="file" accept="image/*" multiple id="fph">
 <label>Add a video (kept for this session)</label><input type="file" accept="video/*" id="fvd">
 <label>Seconds per photo</label><input type="range" min="2" max="10" data-s="iv">
 <div style="margin-top:8px"><button class="btn o" data-a="clr">Clear media</button></div>
 <h4>Reminders &amp; alarm</h4>
 <label>Alarm</label><select data-s="rm"><option value="1">On</option><option value="0">Off</option></select>
 <label>Remind me</label><select data-s="ld"><option value="0">At the time</option><option value="5">5 min before</option><option value="10">10 min before</option><option value="30">30 min before</option></select>
 <label>Alarm sound</label><select data-s="sn"><option value="chime">Chime</option><option value="bell">Bell</option><option value="beep">Beep</option><option value="digital">Digital</option><option value="soft">Soft</option><option value="custom">My own sound</option></select>
 <label>Upload your own sound (mp3, wav…)</label><input type="file" accept="audio/*" id="fsn"><small class="m" id="sfn" style="display:block"></small>
 <label>Volume</label><input type="range" min="0" max="100" data-s="vl">
 <label>Ring</label><select data-s="rp"><option value="1">Once</option><option value="3">3 times</option><option value="5">5 times</option><option value="0">Until I dismiss it</option></select>
 <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn o" data-a="tsnd">▶ Test sound</button><button class="btn o" data-a="ntf">Browser alerts</button><button class="btn o" data-a="csn">Remove my sound</button></div>
 <h4>Widgets</h4><div id="wl"></div>
 <h4>Data</h4><button class="btn o" data-a="reset">Reset everything</button>
</aside>

<div id="al" aria-live="assertive"></div>

<script src="script.js"></script></body></html>
